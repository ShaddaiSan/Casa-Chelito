<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Casa Chelito</title>
  <meta name="description" content="Casa Chelito — tiendita mexicana en Montreal: pan artesanal, paletas, abarrotes, bebidas y antojitos.">
  <link rel="icon" href="assets/logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@400;700;800&family=Pacifico&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body data-pagina="pan" data-titulo="nav.pan">
  <header id="encabezado"></header>
  <div class="papel-picado" aria-hidden="true"></div>

  <main>
  <section class="encabezado-pagina">
    <div class="contenedor">
      <p class="script" data-i18n="pan.eslogan"></p>
      <h1>🍞 <span data-i18n="pan.titulo"></span></h1>
      <p data-i18n="pan.lead"></p>
    </div>
  </section>

  <section class="seccion temporada-banda blanca">
    <div class="contenedor temporada">
      <img class="foto-temporada" src="assets/fotos/pan-de-muerto-horneado.webp" srcset="assets/fotos/pan-de-muerto-horneado-600.webp 600w, assets/fotos/pan-de-muerto-horneado.webp 1200w" sizes="(max-width: 760px) 100vw, 50vw" width="1200" height="800" loading="lazy" alt="" data-i18n-alt="fotos.muertoHorneado">
      <div>
        <p class="script" data-i18n="temporada.eslogan"></p>
        <h2 data-i18n="temporada.titulo"></h2>
        <p data-i18n="temporada.texto"></p>
        <a class="boton" data-tel-link href="#">📞 <span data-i18n="temporada.boton"></span></a>
      </div>
    </div>
  </section>

  <section class="seccion">
    <div class="contenedor">
      <div class="titulo"><h2 data-i18n="pan.dulce"></h2><span class="adorno"></span></div>
      <ul class="lista-productos">
        <li><span data-i18n="pan.concha"></span><small data-i18n="pan.conchaD"></small></li>
        <li><span data-i18n="pan.cuernito"></span><small data-i18n="pan.cuernitoD"></small></li>
        <li><span data-i18n="pan.oreja"></span><small data-i18n="pan.orejaD"></small></li>
        <li><span data-i18n="pan.polvoron"></span><small data-i18n="pan.polvoronD"></small></li>
        <li><span data-i18n="pan.marranito"></span><small data-i18n="pan.marranitoD"></small></li>
        <li><span data-i18n="pan.dona"></span><small data-i18n="pan.donaD"></small></li>
      </ul>
    </div>
  </section>

  <section class="seccion blanca">
    <div class="contenedor">
      <div class="titulo"><h2 data-i18n="pan.salado"></h2><span class="adorno"></span></div>
      <ul class="lista-productos">
        <li><span data-i18n="pan.bolillo"></span><small data-i18n="pan.bolilloD"></small></li>
        <li><span data-i18n="pan.telera"></span><small data-i18n="pan.teleraD"></small></li>
      </ul>
    </div>
  </section>

  <section class="seccion">
    <div class="contenedor">
      <div class="titulo"><h2 data-i18n="pan.temporada"></h2><span class="adorno"></span></div>
      <ul class="lista-productos">
        <li><span data-i18n="pan.muerto"></span><small data-i18n="pan.muertoD"></small></li>
        <li><span data-i18n="pan.rosca"></span><small data-i18n="pan.roscaD"></small></li>
      </ul>
    </div>
  </section>

  <section class="seccion blanca">
    <div class="contenedor">
      <div class="titulo"><h2 data-i18n="galeria.titulo"></h2><span class="adorno"></span></div>
      <div class="galeria">
        <figure><img src="assets/fotos/pan-de-muerto-ajonjoli.webp" srcset="assets/fotos/pan-de-muerto-ajonjoli-600.webp 600w, assets/fotos/pan-de-muerto-ajonjoli.webp 1200w" sizes="(max-width: 760px) 100vw, 50vw" width="1200" height="800" loading="lazy" alt="" data-i18n-alt="fotos.muertoAjonjoli"><figcaption data-i18n="fotos.muertoAjonjoli"></figcaption></figure>
        <figure><img src="assets/fotos/pan-de-muerto-cerca.webp" srcset="assets/fotos/pan-de-muerto-cerca-600.webp 600w, assets/fotos/pan-de-muerto-cerca.webp 1200w" sizes="(max-width: 760px) 100vw, 50vw" width="1200" height="800" loading="lazy" alt="" data-i18n-alt="fotos.muertoCerca"><figcaption data-i18n="fotos.muertoCerca"></figcaption></figure>
        <figure><img src="assets/fotos/conchas-bolsa.webp" srcset="assets/fotos/conchas-bolsa-600.webp 600w, assets/fotos/conchas-bolsa.webp 1200w" sizes="(max-width: 760px) 100vw, 50vw" width="1200" height="800" loading="lazy" alt="" data-i18n-alt="fotos.conchasBolsa"><figcaption data-i18n="fotos.conchasBolsa"></figcaption></figure>
        <figure><img src="assets/fotos/conchas-estante.webp" srcset="assets/fotos/conchas-estante-600.webp 600w, assets/fotos/conchas-estante.webp 1200w" sizes="(max-width: 760px) 100vw, 50vw" width="1200" height="800" loading="lazy" alt="" data-i18n-alt="fotos.conchasEstante"><figcaption data-i18n="fotos.conchasEstante"></figcaption></figure>
        <figure><img src="assets/fotos/pan-de-muerto-horneado.webp" srcset="assets/fotos/pan-de-muerto-horneado-600.webp 600w, assets/fotos/pan-de-muerto-horneado.webp 1200w" sizes="(max-width: 760px) 100vw, 50vw" width="1200" height="800" loading="lazy" alt="" data-i18n-alt="fotos.muertoHorneado"><figcaption data-i18n="fotos.muertoHorneado"></figcaption></figure>
      </div>
    </div>
  </section>

  <section class="seccion">
    <div class="contenedor"><p class="titulo" data-i18n="pan.nota"></p></div>
  </section>
  </main>

  <section class="banda-pedido">
    <div class="contenedor">
      <h2 data-i18n="pedido.titulo"></h2>
      <p data-i18n="pedido.texto"></p>
      <a class="telefono" data-telefono href="#"></a><br>
      <a class="boton claro" data-tel-link href="#">📞 <span data-i18n="pedido.boton"></span></a>
    </div>
  </section>

  <div class="papel-picado" aria-hidden="true"></div>
  <footer id="pie"></footer>
  <script src="js/config.js"></script>
  <script src="js/i18n.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
