    <section class="seccion temporada-banda" aria-labelledby="temporada-titulo">
      <div class="contenedor temporada">
        {{img pan-de-muerto-horneado alt=fotos.muertoHorneado class="foto-temporada" sizes="(min-width: 761px) 50vw, 100vw"}}
        <div class="aparecer">
          <p class="script">{{t.temporada.eslogan}}</p>
          <h2 id="temporada-titulo">{{t.temporada.titulo}}</h2>
          <p>{{t.temporada.texto}}</p>
          <a class="boton" href="tel:{{c.telefono_link}}">{{t.temporada.boton}}</a>
        </div>
      </div>
    </section>
