<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Casa Chelito</title>
  <meta name="description" content="Casa Chelito — tiendita mexicana en Montreal: pan artesanal, paletas, abarrotes, bebidas y antojitos.">
  <link rel="icon" href="assets/logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@400;700;800&family=Pacifico&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body data-pagina="abarrotes" data-titulo="nav.abarrotes">
  <header id="encabezado"></header>
  <div class="papel-picado" aria-hidden="true"></div>

  <main>
  <section class="encabezado-pagina">
    <div class="contenedor">
      <p class="script" data-i18n="abarrotes.eslogan"></p>
      <h1>🛒 <span data-i18n="abarrotes.titulo"></span></h1>
      <p data-i18n="abarrotes.lead"></p>
    </div>
  </section>

  <section class="seccion">
    <div class="contenedor">
      <div class="rejilla">
        <div class="tarjeta"><div class="icono">🌽</div><h3 data-i18n="abarrotes.despensa"></h3><ul><li data-i18n="abarrotes.despensa1"></li><li data-i18n="abarrotes.despensa2"></li><li data-i18n="abarrotes.despensa3"></li><li data-i18n="abarrotes.despensa4"></li></ul></div>
        <div class="tarjeta"><div class="icono">🥤</div><h3 data-i18n="abarrotes.bebidas"></h3><ul><li data-i18n="abarrotes.bebidas1"></li><li data-i18n="abarrotes.bebidas2"></li><li data-i18n="abarrotes.bebidas3"></li><li data-i18n="abarrotes.bebidas4"></li></ul></div>
        <div class="tarjeta"><div class="icono">🌮</div><h3 data-i18n="abarrotes.antojitos"></h3><ul><li data-i18n="abarrotes.antojitos1"></li><li data-i18n="abarrotes.antojitos2"></li><li data-i18n="abarrotes.antojitos3"></li><li data-i18n="abarrotes.antojitos4"></li></ul></div>
      </div>
    </div>
  </section>

  <section class="seccion">
    <div class="contenedor"><p class="titulo" data-i18n="abarrotes.nota"></p></div>
  </section>
  </main>

  <section class="banda-pedido">
    <div class="contenedor">
      <h2 data-i18n="pedido.titulo"></h2>
      <p data-i18n="pedido.texto"></p>
      <a class="telefono" data-telefono href="#"></a><br>
      <a class="boton claro" data-tel-link href="#">📞 <span data-i18n="pedido.boton"></span></a>
    </div>
  </section>

  <div class="papel-picado" aria-hidden="true"></div>
  <footer id="pie"></footer>
  <script src="js/config.js"></script>
  <script src="js/i18n.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
