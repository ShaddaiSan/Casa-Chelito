<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Casa Chelito</title>
  <meta name="description" content="Casa Chelito — tiendita mexicana en Montreal: pan artesanal, paletas, abarrotes, bebidas y antojitos.">
  <link rel="icon" href="assets/logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@400;700;800&family=Pacifico&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body data-pagina="paletas" data-titulo="nav.paletas">
  <header id="encabezado"></header>
  <div class="papel-picado" aria-hidden="true"></div>

  <main>
  <section class="encabezado-pagina">
    <div class="contenedor">
      <p class="script" data-i18n="paletas.eslogan"></p>
      <h1>🍭 <span data-i18n="paletas.titulo"></span></h1>
      <p data-i18n="paletas.lead"></p>
    </div>
  </section>

  <section class="seccion">
    <div class="contenedor">
      <div class="titulo"><h2 data-i18n="paletas.agua"></h2><span class="adorno"></span></div>
      <ul class="lista-productos">
        <li><span data-i18n="paletas.mango"></span></li>
        <li><span data-i18n="paletas.limon"></span></li>
        <li><span data-i18n="paletas.tamarindo"></span></li>
        <li><span data-i18n="paletas.jamaica"></span></li>
        <li><span data-i18n="paletas.sandia"></span></li>
        <li><span data-i18n="paletas.pepino"></span></li>
      </ul>
    </div>
  </section>

  <section class="seccion blanca">
    <div class="contenedor">
      <div class="titulo"><h2 data-i18n="paletas.leche"></h2><span class="adorno"></span></div>
      <ul class="lista-productos">
        <li><span data-i18n="paletas.fresa"></span></li>
        <li><span data-i18n="paletas.coco"></span></li>
        <li><span data-i18n="paletas.arroz"></span></li>
        <li><span data-i18n="paletas.mazapan"></span></li>
        <li><span data-i18n="paletas.nuez"></span></li>
        <li><span data-i18n="paletas.chocolate"></span></li>
      </ul>
    </div>
  </section>

  <section class="seccion">
    <div class="contenedor"><p class="titulo" data-i18n="paletas.nota"></p></div>
  </section>
  </main>

  <section class="banda-pedido">
    <div class="contenedor">
      <h2 data-i18n="pedido.titulo"></h2>
      <p data-i18n="pedido.texto"></p>
      <a class="telefono" data-telefono href="#"></a><br>
      <a class="boton claro" data-tel-link href="#">📞 <span data-i18n="pedido.boton"></span></a>
    </div>
  </section>

  <div class="papel-picado" aria-hidden="true"></div>
  <footer id="pie"></footer>
  <script src="js/config.js"></script>
  <script src="js/i18n.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
